aid: groundwork-open-source
name: Groundwork Open Source
description: >-
  GroundWork Open Source, Inc. builds GroundWork Monitor, an open-source-based IT
  and network monitoring platform for hybrid infrastructure, assembling Nagios
  Core, Telegraf, InfluxDB, and Grafana into a unified availability, event, and
  metrics monitoring product. Its integration layer, the Transit Connection
  Generator (TCG), exposes a Controller REST API and a Go SDK for feeding host/
  service inventory, metrics, alert events, and downtime windows into the
  GroundWork Foundation server. The platform is self-hosted; all source lives on
  GitHub under the gwos organization (TCG, Nagios Core, Grafana, and Telegraf
  forks). Surfaced as a portfolio company of Canaan Partners and enriched here
  from its live GitHub org and published Swagger 2.0 API specification.
